<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lambamba - Play & Win</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#1e1e1e;padding:20px;border-radius:18px;max-width:380px;margin:30px auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.balance{font-size:36px;color:#00e676;font-weight:bold;margin:10px 0}
button{width:100%;padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:bold;margin-top:12px;cursor:pointer}
.deposit{background:#00c853;color:#fff}
.withdraw{background:#333;color:#fff;border:1px solid #444}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:999}
.box{background:#fff;color:#000;padding:22px;border-radius:16px;width:90%;max-width:340px}
input{width:94%;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:10px;font-size:16px}
</style>
</head>
<body>
<h1>🎮 LAMBAMBA</h1>
<div class="card">
<p style="opacity:.7">Your Balance</p>
<div class="balance">GHS <span id="bal">0.00</span></div>
<button class="deposit" onclick="openM()">DEPOSIT (MoMo & Card)</button>
<button class="withdraw" onclick="alert('Withdraw via WhatsApp Admin')">WITHDRAW</button>
</div>

<div id="m" class="modal"><div class="box">
<h3 style="margin-top:0">Deposit Funds</h3>
<input id="amt" type="number" placeholder="Amount Min GHS 5" value="20" oninput="document.getElementById('pAmt').innerText=this.value">
<input id="email" type="email" value="linkinglimited5@gmail.com">
<button class="deposit" onclick="pay()">Pay GHS <span id="pAmt">20</span></button>
<button style="background:#eee" onclick="closeM()">Cancel</button>
<p style="font-size:11px;color:#666;margin-top:12px">🔒 Secured by Paystack - MTN, Telecel, AirtelTigo supported</p>
</div></div>

<script>
let bal=Number(localStorage.getItem('lamba_bal')||0);
document.getElementById('bal').innerText=bal.toFixed(2);
function openM(){document.getElementById('m').style.display='flex'}
function closeM(){document.getElementById('m').style.display='none'}
function pay(){
 let a=Number(document.getElementById('amt').value);
 let e=document.getElementById('email').value.trim();
 if(a<5)return alert('Min GHS 5');
 if(!e)return alert('Enter email');
 PaystackPop.setup({
  key:'pk_live_c3cbce0387fd58c85d6c0940035dba6b9b98724f',
  email:e,
  amount:a*100,
  currency:'GHS',
  channels:['mobile_money','card'],
  callback:function(r){
   bal+=a;localStorage.setItem('lamba_bal',bal);
   document.getElementById('bal').innerText=bal.toFixed(2);
   closeM();alert('✅ SUCCESS! GHS '+a+' Added! Ref: '+r.reference);
  },
  onClose:function(){alert('Payment cancelled')}
 }).openIframe();
}
</script>
</body>
</html>

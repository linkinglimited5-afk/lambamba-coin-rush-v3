<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAMBAMBA COIN RUSH</title>
<style>
body{background:#111;color:white;font-family:Arial;text-align:center;margin:0;padding:20px}
.card{background:#222;padding:20px;border-radius:20px;max-width:400px;margin:auto}
button{width:100%;padding:15px;margin:10px 0;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
#coin{font-size:150px;cursor:pointer;user-select:none;transition:transform 0.1s}
#coin:active{transform:scale(0.9)}
</style>
</head>
<body>
<h1>💰 LAMBAMBA COIN RUSH</h1>
<div class="card">
<h2 id="bal">Balance: GHS 219.25</h2>
<p id="user">0537613225 | ROMANUS</p>

<div id="homeScreen">
<button style="background:#2563eb;color:white" onclick="deposit()">💳 DEPOSIT GHS 20 TO PLAY</button>
<button style="background:orange;color:white" onclick="startGame()">🎮 PLAY & WIN (Costs GHS 5)</button>
<button style="background:#16a34a;color:white" onclick="withdraw()">💸 WITHDRAW WINNINGS</button>
<p style="color:#666;font-size:13px">Deposit first. Winnings withdrawable to MoMo in minutes.</p>
</div>

<div id="gameScreen" style="display:none">
<h3>Tap the coin! 30 seconds!</h3>
<h2>Time: <span id="time">30</span>s | Coins: <span id="score">0</span></h2>
<div id="coin" onclick="tap()">🪙</div>
<h3 id="result"></h3>
<button style="background:gray" onclick="goHome()">Back Home</button>
</div>

</div>
<script>
let balance = 219.25;
let score = 0;
let timeLeft = 30;
let timer = null;
let playing = false;

function updateBal(){ document.getElementById('bal').innerText = 'Balance: GHS ' + balance.toFixed(2); }

function startGame(){
 if(balance < 5){ alert('Deposit first!'); return; }
 balance -= 5; updateBal();
 document.getElementById('homeScreen').style.display='none';
 document.getElementById('gameScreen').style.display='block';
 score=0; timeLeft=30; playing=true;
 document.getElementById('score').innerText=score;
 document.getElementById('time').innerText=timeLeft;
 document.getElementById('result').innerText='';
 clearInterval(timer);
 timer = setInterval(()=>{
   timeLeft--; document.getElementById('time').innerText=timeLeft;
   if(timeLeft<=0){ endGame(); }
 },1000);
}
function tap(){
 if(!playing) return;
 score++; document.getElementById('score').innerText=score;
 // vibration effect
 navigator.vibrate && navigator.vibrate(30);
}
function endGame(){
 playing=false; clearInterval(timer);
 let win = score * 0.1; // 10 pesewas per tap
 balance += win; updateBal();
 document.getElementById('result').innerText = `You tapped ${score} times! Won GHS ${win.toFixed(2)}!`;
}
function goHome(){
 clearInterval(timer); playing=false;
 document.getElementById('gameScreen').style.display='none';
 document.getElementById('homeScreen').style.display='block';
}
function deposit(){ window.location.href='/api/paystack-init'; }
function withdraw(){
 let amt = prompt('How much to withdraw? Balance: '+balance);
 if(!amt) return;
 fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:amt,phone:'0537613225'})})
 .then(r=>r.json()).then(d=>alert(d.message||'Request sent!'));
}
</script>
</body>
</html>

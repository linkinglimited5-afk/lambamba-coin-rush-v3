<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAMBAMBA COIN RUSH</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.btn{padding:14px;border:0;border-radius:10px;font-weight:bold;width:100%;margin:8px 0}
input,select{width:100%;padding:14px;margin:8px 0;border-radius:8px;border:0;box-sizing:border-box}
.card{background:#1a1a1a;padding:20px;border-radius:15px;margin:15px}
#gameArea{text-align:center;padding:20px}
</style>
</head>
<body>

<!-- 1. REGISTRATION PAGE - FORCES PHONE NUMBER -->
<div id="regPage" style="position:fixed;inset:0;background:#111;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
<div style="background:#222;padding:25px;border-radius:15px;width:100%;max-width:360px">
<h2 style="color:#00ff88;text-align:center;margin:0">LAMBAMBA</h2>
<p style="color:#aaa;text-align:center">Login with MoMo to play</p>
<input id="rPhone" type="tel" placeholder="MoMo Number e.g 0537613225">
<input id="rName" type="text" placeholder="MoMo Name e.g ROMANUS">
<select id="rNet"><option>MTN</option><option>Vodafone</option><option>AirtelTigo</option></select>
<button onclick="doReg()" class="btn" style="background:#00c853;color:#fff">ENTER GAME</button>
</div>
</div>

<!-- 2. GAME AREA -->
<div id="gameArea">
<h1>💰 LAMBAMBA COIN RUSH</h1>
<div class="card">
<h2>Balance: GHS <span id="bal">0.00</span></h2>
<p id="userInfo" style="color:#aaa"></p>
<button onclick="playGame()" class="btn" style="background:#ff9800;color:#fff;font-size:18px">🎮 PLAY & WIN GHS 5</button>
<button onclick="openW()" class="btn" style="background:#00c853;color:#fff">💸 WITHDRAW</button>
</div>
</div>

<!-- 3. WITHDRAW MODAL -->
<div id="wPage" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9998;align-items:center;justify-content:center;padding:20px">
<div style="background:#222;padding:25px;border-radius:15px;width:100%;max-width:360px">
<h3 style="text-align:center">Withdraw to MoMo</h3>
<input id="wAmt" type="number" placeholder="Amount Min GHS 20">
<input id="wPhone" type="tel" placeholder="0537613225">
<input id="wName" type="text" placeholder="ROMANUS">
<select id="wNetwork"><option>MTN</option><option>Vodafone</option><option>AirtelTigo</option></select>
<button id="wBtn" onclick="withdrawReq()" class="btn" style="background:#00c853;color:#fff">WITHDRAW NOW</button>
<button onclick="closeW()" class="btn" style="background:#444;color:#fff">CANCEL</button>
</div>
</div>

<script>
let bal = parseFloat(localStorage.getItem('lamba_bal')||'0');

// Check if registered
window.onload=()=>{
 let p=localStorage.getItem('lamba_phone');
 if(p){
   document.getElementById('regPage').style.display='none';
   document.getElementById('userInfo').innerText = p+' | '+localStorage.getItem('lamba_name');
   // auto fill withdraw
   document.getElementById('wPhone').value=localStorage.getItem('lamba_phone');
   document.getElementById('wName').value=localStorage.getItem('lamba_name');
   document.getElementById('wNetwork').value=localStorage.getItem('lamba_network')||'MTN';
 }
 render();
}

function doReg(){
 let phone=document.getElementById('rPhone').value.trim();
 let name=document.getElementById('rName').value.trim();
 let net=document.getElementById('rNet').value;
 if(!phone||phone.length<10) return alert('Enter valid MoMo number');
 if(!name) return alert('Enter MoMo name');
 localStorage.setItem('lamba_phone',phone);
 localStorage.setItem('lamba_name',name);
 localStorage.setItem('lamba_network',net);
 document.getElementById('regPage').style.display='none';
 location.reload();
}

function render(){ document.getElementById('bal').innerText=bal.toFixed(2); }
function playGame(){ bal+=5; localStorage.setItem('lamba_bal',bal); localStorage.setItem('balance',bal); render(); alert('You won GHS 5! Balance: '+bal); }
function openW(){ document.getElementById('wPage').style.display='flex'; }
function closeW(){ document.getElementById('wPage').style.display='none'; }

async function withdrawReq(){
 let a=parseFloat(document.getElementById('wAmt').value);
 let phone=document.getElementById('wPhone').value.trim();
 let name=document.getElementById('wName').value.trim();
 let network=document.getElementById('wNetwork').value;
 if(!a||a<20) return alert('Min GHS 20');
 if(a>bal) return alert('Insufficient balance, you have GHS '+bal.toFixed(2));
 if(!phone||phone.length<10) return alert('Enter valid MoMo number');
 if(!name) return alert('Enter MoMo name');
 document.getElementById('wBtn').innerText='Processing...'; document.getElementById('wBtn').disabled=true;
 try{
  // FIXED: now sending phone, network, accountName correctly
  const res=await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:a,phone:phone,network:network,accountName:name})});
  const data=await res.json();
  if(data.success||data.status===true){
   bal-=a;localStorage.setItem('lamba_bal',bal);localStorage.setItem('balance',bal);render();closeW();
   alert('✅ SUCCESS! GHS '+a+' sent to '+phone+'. Check your MoMo!');
  }else{
   alert('❌ Failed: '+(data.message||data.error||'Try again'));
   document.getElementById('wBtn').innerText='WITHDRAW NOW';document.getElementById('wBtn').disabled=false;
  }
 }catch(e){
  alert('Network error: '+e.message);
  document.getElementById('wBtn').innerText='WITHDRAW NOW';document.getElementById('wBtn').disabled=false;
 }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lambamba Coin Rush - Real Cashout</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{background:#0b0f1a;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#151b2d;padding:20px;border-radius:20px;max-width:400px;margin:auto}
.coin{width:150px;height:150px;background:gold;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 0 30px gold;cursor:pointer;user-select:none}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;font-weight:bold;cursor:pointer}
.deposit{background:#00ff88;color:#000}
.withdraw{background:#ffcc00;color:#000}
</style>
</head>
<body>
<div class="card">
<h2>Lambamba Coin Rush 🪙</h2>
<div class="coin" onclick="tap()">L</div>
<p>Coins: <span id="coins">0</span> | Balance: GHS <span id="bal">0.00</span></p>
<button class="deposit" onclick="deposit()">DEPOSIT WITH PAYSTACK (MoMo)</button>
<button class="withdraw" onclick="withdraw()">WITHDRAW (MIN GHS 50)</button>
<p style="font-size:12px;opacity:.6">1 coin = GHS 0.01 | Withdraw to MoMo<br>Real money mode enabled</p>
<input id="phone" placeholder="MoMo Number for Withdraw" style="width:100%;padding:12px;border-radius:10px;border:0;margin-top:10px">
</div>
<script>
let coins = parseInt(localStorage.getItem('coins'))||0;
let bal = parseFloat(localStorage.getItem('bal'))||0;
update();
function tap(){coins++; if(coins%10==0){bal+=0.10;} update();}
function update(){document.getElementById('coins').innerText=coins; document.getElementById('bal').innerText=bal.toFixed(2); localStorage.setItem('coins',coins); localStorage.setItem('bal',bal);}
function deposit(){
 let amount = prompt("Enter amount to deposit in GHS (Min 5):","20");
 if(!amount) return;
 let email = prompt("Enter your email for receipt:","player@lambamba.com");
 // *** LIVE KEY HARDCODED - FIXED ***
 let handler = PaystackPop.setup({
   key: 'pk_live_c3cbce0387fd58c85d6c0940035dba6b9b98724f',
   email: email,
   amount: Math.floor(parseFloat(amount)*100),
   currency: 'GHS',
   channels: ['mobile_money','card'],
   callback: function(response){
     alert('Payment Success! Ref: '+response.reference);
     let added = parseFloat(amount);
     bal += added; coins += Math.floor(added*100);
     update();
   },
   onClose: function(){ alert('Payment window closed'); }
 });
 handler.openIframe();
}
function withdraw(){
 if(bal < 50){ alert('Min withdrawal GHS 50. Your bal: GHS '+bal.toFixed(2)); return;}
 let phone = document.getElementById('phone').value;
 if(!phone){ alert('Enter MoMo number'); return;}
 alert('Withdrawal request GHS '+bal.toFixed(2)+' to '+phone+' submitted! We will pay within 2 hours.');
 bal = 0; update();
}
</script>
</body>
</html>
